name: cultivos_molina
description: Sistema móvil de análisis estadísticos - Cultivos Molina
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Estado BLoC
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Gráficos
  fl_chart: ^0.66.2

  # UI
  google_fonts: ^6.1.0

  # Utilidades
  intl: ^0.18.1
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
